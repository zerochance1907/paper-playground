<style>
  #prompt { font: inherit; font-family: var(--mono); font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); width: 100%; box-sizing: border-box; }
  .out { font-family: var(--mono); font-size: 13px; line-height: 1.55; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-height: 90px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 10px; }
  .out b { color: var(--accent); font-weight: 600; }
  .bars { display: grid; grid-template-columns: 28px 1fr 44px; gap: 3px 8px; align-items: center; font-family: var(--mono); font-size: 12px; margin-top: 8px; }
  .bars .track { background: var(--surface); height: 12px; border-radius: 3px; overflow: hidden; }
  .bars .fill { height: 100%; background: var(--accent); }
</style>
<div class="demo-grid">
  <div class="panel">
    <h3>1 · Predict the next character from the last few</h3>
    <label for="prompt" class="readout">Prompt (the model continues it)</label>
    <input id="prompt" type="text" value="the light" autocomplete="off" spellcheck="false">
    <div class="controls">
      <label>Context length <input type="range" id="ctx" min="0" max="6" step="1" value="3"></label>
      <span class="readout" id="ctx-readout"></span>
      <label>Temperature <input type="range" id="temp" min="0.1" max="1.5" step="0.1" value="0.8"></label>
      <button class="btn primary" id="generate" type="button">▶ Generate</button>
    </div>
    <div class="out" id="out" aria-live="polite"></div>
  </div>
  <div class="panel">
    <h3>Next-character probabilities after the prompt</h3>
    <div class="bars" id="bars"></div>
    <h3 style="margin-top:14px">Bits per character by context length · lower is better</h3>
    <canvas id="bpc" aria-label="Bar chart of training and held-out bits per character for context lengths 0 to 6."></canvas>
  </div>
</div>
