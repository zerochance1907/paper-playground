<style>
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .legend b { font-weight: 700; }
  select { font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .board { width: 100%; font-family: var(--mono); font-size: 12px; border-collapse: collapse; margin-top: 10px; }
  .board td { padding: 3px 4px; border-bottom: 1px solid var(--border); }
  .board td:last-child { text-align: right; }
</style>
<div class="demo-grid">
  <div class="panel">
    <h3>1 · Optimizers race downhill · tap the map to pick a start</h3>
    <canvas id="surface" aria-label="Heat map of a 2D loss surface, darker means lower loss, with one coloured trail per optimizer and a cross marking the minimum."></canvas>
    <div class="legend" id="legend"></div>
    <div class="controls">
      <label>Surface
        <select id="surface-select">
          <option value="ravine">Ravine (steep in y, flat in x)</option>
          <option value="rosenbrock">Rosenbrock (curved valley)</option>
          <option value="saddle">Saddle (flat ridge)</option>
          <option value="noisy">Noisy bowl (minibatch noise)</option>
        </select>
      </label>
      <label>Learning rate <input type="range" id="lr" min="-3" max="-0.25" step="0.25" value="-1.5"></label>
      <span class="readout" id="lr-readout"></span>
      <button class="btn" id="replay" type="button">↺ Replay</button>
    </div>
  </div>
  <div class="panel">
    <h3>Loss above the minimum (log scale)</h3>
    <canvas id="loss" aria-label="Loss minus the minimum loss over steps, log scale, one line per optimizer."></canvas>
    <table class="board" id="board"></table>
  </div>
</div>
