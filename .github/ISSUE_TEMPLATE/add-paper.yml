name: Request a paper
description: Suggest a paper to turn into an interactive demo
title: "Add paper: "
labels: ["paper-request"]
body:
  - type: input
    id: arxiv
    attributes:
      label: arXiv link
      description: The paper's arXiv URL or id (e.g. https://arxiv.org/abs/1706.03762)
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should the demo show? (optional)
      description: The one idea you'd want someone to "get" by playing with it.
  - type: markdown
    attributes:
      value: |
        A maintainer adds the `build-paper` label (a Claude agent builds a custom demo) or `generate-free` (the free generator picks a demo engine). Either way the demo is checked in a real browser and opened as a pull request for review.
