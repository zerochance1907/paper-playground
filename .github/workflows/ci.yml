name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; it never needs to write.
permissions:
  contents: read

jobs:
  check-demos:
    name: Every demo works in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
