name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-demos:
    name: Every demo works in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
